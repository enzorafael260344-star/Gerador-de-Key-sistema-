<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Key</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    padding: 20px;
  }
  .container {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 35px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    color: #fff;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #00d2ff, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.sub {
    text-align: center;
    color: #aaa;
    font-size: 0.85rem;
    margin-bottom: 25px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: #ccc;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  input, select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3);
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    transition: 0.2s;
  }
  input:focus, select:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,0.25); }
  select option { background: #24243e; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #00d2ff, #a855f7);
    color: #fff;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(168,85,247,0.4); }
  button:active { transform: translateY(0); }
  .result {
    margin-top: 22px;
    padding: 18px;
    border-radius: 12px;
    background: rgba(0,0,0,0.35);
    border: 1px dashed rgba(0,210,255,0.4);
    word-break: break-all;
    font-family: 'Courier New', monospace;
    font-size: 1.1rem;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #00e0ff;
    letter-spacing: 1px;
  }
  .copy-btn {
    margin-top: 12px;
    padding: 10px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    width: 100%;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.2); }
  .footer { text-align: center; color: #666; font-size: 0.75rem; margin-top: 18px; }
</style>
</head>
<body>
  <div class="container">
    <h1>🔑 Gerador de Key</h1>
    <p class="sub">Letras + números aleatórios</p>

    <label for="tamanho">Tamanho da key</label>
    <input type="number" id="tamanho" value="16" min="4" max="64">

    <label for="formato">Formato</label>
    <select id="formato">
      <option value="tudo">Tudo junto (A1B2C3...)</option>
      <option value="hifen">Com hífens (A1B2-C3D4-...)</option>
    </select>

    <button onclick="gerarKey()">Gerar Key</button>

    <div class="result" id="resultado">Sua key aparecerá aqui...</div>
    <button class="copy-btn" onclick="copiar()">📋 Copiar Key</button>

    <div class="footer">Gerado com aleatoriedade criptográfica (crypto)</div>
  </div>

<script>
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

function gerarKey() {
  let tamanho = parseInt(document.getElementById('tamanho').value) || 16;
  tamanho = Math.min(64, Math.max(4, tamanho));
  const formato = document.getElementById('formato').value;

  const arr = new Uint32Array(tamanho);
  crypto.getRandomValues(arr);

  let key = '';
  for (let i = 0; i < tamanho; i++) {
    key += CHARS[arr[i] % CHARS.length];
  }

  if (formato === 'hifen') {
    key = key.match(/.{1,4}/g).join('-');
  }

  document.getElementById('resultado').textContent = key;
}

function copiar() {
  const txt = document.getElementById('resultado').textContent;
  if (!txt || txt.includes('aparecerá')) return;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.querySelector('.copy-btn');
    const original = btn.textContent;
    btn.textContent = '✅ Copiado!';
    setTimeout(() => btn.textContent = original, 1500);
  });
}
</script>
</body>
</html>
